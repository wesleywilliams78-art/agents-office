<!doctype html>
<html><head><meta charset="utf-8">
<title>Norway fjord reel</title>
<style>
@font-face { font-family: 'Archivo'; font-weight: 400; src: url(kit/fonts/archivo-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 500; src: url(kit/fonts/archivo-latin-500-normal.woff2) format('woff2'); }
html, body { margin: 0; background: #201E1D; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #201E1D; }
canvas { display: block; }
</style>
<script src="kit/motion-kit.js"></script>
<script src="kit/sound-kit.js"></script>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
// Norway grid row: a fjord reel either side of the Norway motion reel. Real Pexels footage (graded and cropped to frame
// sequences beforehand), the white WRW Hospitality lockup at the foot, the second shot opening out of a band at the height
// of the flag's cross bar, and a close where the logo lifts and a Norway-blue panel grows out of it into the contact card.
const REEL = __REEL__;
const W = 1080, H = 1920, B = n => n * .5, END = 36, FPS = 30, HZ = 540;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const [RED, WH, K] = ['#EC3013', '#F3F2F2', '#201E1D'].map(rgb), NB = rgb('#00205B');   // Norway's flag blue for the close
const css = (c, a = 1) => `rgba(${c.map(v => Math.round(v)).join(',')},${a})`;
const SP = { f: { stiffness: 620, damping: 50 }, s: { stiffness: 300, damping: 35 }, m: { stiffness: 160, damping: 26 } };
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), LOGO = new Image();

// footage: one graded JPEG per frame, loaded when a frame is painted
const cache = new Map();
async function frame(dir, n, i) {
  i = Math.max(1, Math.min(n, i)); const key = dir + i; if (cache.has(key)) return cache.get(key);
  const img = new Image(); img.src = `${REEL.root}/${dir}/f_${String(i).padStart(4, '0')}.jpg`; await img.decode();
  cache.set(key, img); if (cache.size > 8) cache.delete(cache.keys().next().value); return img;
}
const T_B = B(17.5);                                         // the second shot opens from here
const idxA = t => Math.floor(Math.max(0, t - .5) * FPS + 1e-6) + 1;   // frame 0 held for half a second, then the shot plays
const idxB = t => Math.floor(Math.max(0, t - T_B) * FPS + 1e-6) + 1;

// type
const wOf = (text, size, weight = 500, spacing = -size / 40) => { ctx.font = `${weight} ${size}px Archivo`; ctx.letterSpacing = spacing + 'px'; return ctx.measureText(text).width; };
const fitMin = (lines, maxW, cap) => Math.min(cap, ...lines.map(l => maxW / (wOf(l, 100) / 100)));
function line(t, text, y, size, inB, roll = null) {   // centred, rolling up word by word through its own window
  if (t < B(inB) - .001) return;
  ctx.font = `500 ${size}px Archivo`; ctx.letterSpacing = (-size / 40) + 'px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const words = text.split(' '), space = ctx.measureText(' ').width, ws = words.map(w => ctx.measureText(w).width), total = ws.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let x = W / 2 - total / 2, li = 0;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - size * .98, total + 80, size * 1.3); ctx.clip(); ctx.fillStyle = css(WH);
  words.forEach((w, k) => {
    const inn = 1 - M.spring(t, B(inB) + k * .06, 0, 1, SP.f);
    if (inn < 1) {
      if (roll == null) ctx.fillText(w, x, y + inn * size * 1.2);
      else for (let c = 0; c < w.length; c++) {   // a rigid roll: each letter leaves upward on the spring that brings its copy up from below
        const r = M.spring(t, B(roll) + (li + c) * .028, 0, 1, SP.f) * size * 1.25, cx = x + ctx.measureText(w.slice(0, c)).width;
        if (r < size * 1.249) ctx.fillText(w[c], cx, y + inn * size * 1.2 - r);
        if (r > .5) ctx.fillText(w[c], cx, y + inn * size * 1.2 - r + size * 1.25);
      }
    }
    li += w.length + 1; x += ws[k] + space;
  });
  ctx.restore();
}

// the WRW Hospitality lockup: white mark over a spaced HOSPITALITY, at the foot until the close lifts it
const LW = 250, LH = LW * 218 / 804, FOOT_Y = 1440, TOP_Y = 450;
function lockup(t) {
  const up = M.spring(t, B(28), 0, 1, SP.m), sc = 1 + .5 * up, y = FOOT_Y + (TOP_Y - FOOT_Y) * up, w = LW * sc, h = LH * sc;
  ctx.drawImage(LOGO, 64, 64, 804, 218, W / 2 - w / 2, y, w, h);
  ctx.font = `500 ${28 * sc}px Archivo`; ctx.letterSpacing = (10 * sc) + 'px'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = css(WH);
  ctx.fillText('HOSPITALITY', W / 2 + 5 * sc, y + h + 52 * sc);
  return { x: W / 2 - w / 2 - 24, y: y - 20, w: w + 48, h: h + 82 * sc };
}

let SE;
M.scene({
  width: W, height: H, fps: FPS, duration: END * .5, bpm: 120, cuts: [1, 17.5, 28], holds: [[16.25, 18]],
  async setup() {
    LOGO.src = 'kit/logos/wrw-mark-white.png'; await LOGO.decode();
    await Promise.all([document.fonts.load('500 100px Archivo'), document.fonts.load('400 40px Archivo')]);
    SE = fitMin(['CONTACT US', 'FOR FRANCHISING', 'IN NORWAY.'], 860, 116);
    await frame(REEL.a, REEL.na, 1);
  },
  async render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    // the first shot, then the second opening out of a band at the cross-bar height
    ctx.drawImage(await frame(REEL.a, REEL.na, idxA(t)), 0, 0, W, H);
    const open = M.spring(t, T_B, 0, 1, SP.m);
    if (open > 0) {
      const top = HZ * (1 - open), bot = HZ + (H - HZ) * open;
      ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bot - top); ctx.clip(); ctx.drawImage(await frame(REEL.b, REEL.nb, idxB(t)), 0, 0, W, H); ctx.restore();
      if (open < .985) { ctx.fillStyle = css(WH); ctx.fillRect(0, top - 3, W, 6); ctx.fillRect(0, bot - 3, W, 6); }
    }
    // a soft ink floor so the white lockup reads on any water
    const g = ctx.createLinearGradient(0, 1180, 0, H); g.addColorStop(0, css(K, 0)); g.addColorStop(1, css(K, .5)); ctx.fillStyle = g; ctx.fillRect(0, 1180, W, H - 1180);
    // the close: a Norway-blue panel grows out of the lockup as it lifts; the card breathes until the last half second
    const grow = M.spring(t, B(28) + .08, 0, 1, SP.m);
    const env = M.p(t, B(29), .6, 'sine.inOut') * (1 - M.p(t, B(34), .8, 'sine.inOut')), z = 1 + .012 * Math.sin(2 * Math.PI * t / 3) * env;
    if (grow > 0) {
      const a = { x: W / 2 - LW / 2 - 24, y: FOOT_Y - 20, w: LW + 48, h: LH + 82 }, k = grow;
      const x0 = a.x * (1 - k) - 20 * k, y0 = a.y * (1 - k) - 20 * k, x1 = (a.x + a.w) * (1 - k) + (W + 20) * k, y1 = (a.y + a.h) * (1 - k) + (H + 20) * k;
      ctx.fillStyle = css(NB); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
    ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z) + 8 * Math.cos(2 * Math.PI * t / 6) * env);
    lockup(t);
    const L0 = 930;
    ['CONTACT US', 'FOR FRANCHISING', 'IN NORWAY.'].forEach((l, n) => line(t, l, L0 + SE * 1.08 * n, SE, 29.5 + n * .5, n === 2 ? 33 : null));
    // NORWAY. takes a red rule (the flag's red on its blue), then the ask opens below it
    const ny = L0 + SE * 2.16, nw = wOf('NORWAY.', SE), nx = W / 2 + (wOf('IN NORWAY.', SE) / 2) - nw, rk = M.p(t, B(31.5), .35, 'expo.out');
    if (rk > 0) { ctx.fillStyle = css(RED); ctx.fillRect(nx, ny + 20, nw * rk, 8); }
    const bk = M.spring(t, B(32.5), 0, 1, SP.f);
    if (bk > .002) {
      const label = 'DM US “NORWAY”', size = 40, bw = wOf(label, size, 500, 2) + 64, bh = 86, bx = W / 2 - bw / 2, by = ny + 90;
      ctx.save(); ctx.beginPath(); ctx.rect(bx + bw / 2 * (1 - bk), by, bw * bk, bh); ctx.clip(); ctx.fillStyle = css(WH); ctx.fillRect(bx, by, bw, bh);
      ctx.font = `500 ${size}px Archivo`; ctx.letterSpacing = '2px'; ctx.textAlign = 'left'; ctx.fillStyle = css(NB); ctx.fillText(label, bx + 32, by + bh / 2 + size * .36); ctx.restore();
    }
  },
  score(S) {
    const b = S.beat, prog = [['D3', 'F#3', 'A3'], ['B2', 'D3', 'F#3'], ['G2', 'B2', 'D3'], ['A2', 'C#3', 'E3']], roots = ['D2', 'B1', 'G1', 'A1'];
    for (let bar = 0; bar < 9; bar++) {
      S.pad(S.bar(bar), prog[bar % 4], S.bar(1) * 1.02, { gain: .17 });
      for (let e = 0; e < 8; e++) S.bass(S.bar(bar) + e * S.step(2), roots[bar % 4], .2, { gain: bar < 1 ? .25 : .42 });
    }
    for (let n = 1; n < END; n++) { S.kick(b(n), { gain: n % 4 === 0 ? .9 : .75 }); if (n % 2 === 1) S.clap(b(n), { gain: .35 }); S.hat(b(n + .5), { gain: .32 }); }
    S.stamp(b(0), { gain: .4 }); S.impact(b(1), { gain: .5 });
    S.whoosh(b(17.5), .5, { gain: .45 }); S.impact(b(17.5), { gain: .55 });                // the band opens
    S.riser(b(28), 2, { gain: .5 }); S.impact(b(28), { gain: .8 });                          // the lockup lifts, the blue grows
    [['A4', 29.5], ['D5', 30], ['F#5', 30.5]].forEach(([nt, n]) => S.pluck(b(n), nt, .45, { gain: .42 }));
    S.pluck(b(31.5), 'A5', .5, { gain: .4 }); S.stamp(b(32.5), { gain: .55 }); S.impact(b(33), { gain: .5 });
  },
});
</script>
</body></html>
