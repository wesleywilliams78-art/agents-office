  <script>
    const spring = (z, w) => { const wd = w * Math.sqrt(1 - z * z), dur = 6 / (z * w); return { dur, ease: (p) => { const t = p * dur; return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t)); } }; };
    const pop = spring(0.5, 17), firm = spring(0.82, 18);
    const tl = gsap.timeline({ paused: true });
    // scene starts at 28.8 s. Popeyes lands as he points (29.1), Wingstop on the word "Wingstop" (30.64), strikes on "nobody" (31.46)

      tl.fromTo(`#${id}-art`, { scale: 0.2, rotation: tilt * 4, opacity: 0, y: 30 }, { scale: 1, rotation: tilt, opacity: 1, y: 0, duration: pop.dur, ease: pop.ease }, at);
      tl.set(`#${id}-ring`, { scale: 0.3, opacity: 0.85 }, at);
      tl.to(`#${id}-ring`, { scale: 1.8, opacity: 0, duration: 0.55, ease: "power2.out" }, at + 0.001);
    };
    land("pop", 0.3, -4);
    land("wing", 1.84, 3);
    tl.fromTo("#pop-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 2.66);
    tl.fromTo("#wing-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 2.78);
    tl.fromTo(["#pop-img", "#wing-img"], { opacity: 1 }, { opacity: 0.5, duration: 0.3, ease: "power2.out" }, 2.74);
    tl.to("#pop-art", { y: 8, scale: 0.93, duration: firm.dur, ease: firm.ease }, 2.74);
    tl.to("#wing-art", { y: 8, scale: 0.93, duration: firm.dur, ease: firm.ease }, 2.86);
    tl.to(["#pop-art", "#wing-art"], { opacity: 0, scale: 0.8, duration: 0.26, ease: "power2.in" }, 4.22);
    window.__timelines["logos"] = tl;
  </script>
