<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The Operator's Ledger: tokens from ../DESIGN.md. Generated by .vo/build.py; edit there. */
      :root { --bone: #f3f2f2; --ink: #201e1d; --red: #ec3013; --deep-red: #b6240e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--bone); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="97.6" data-width="1080" data-height="1350">
      <!-- scenes -->
      <div id="cold" data-composition-id="cold" data-composition-src="compositions/cold.html"
        data-start="0.0" data-duration="11.7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1350"></div>
      <div id="stp" data-composition-id="stp" data-composition-src="compositions/stp.html"
        data-start="11.7" data-duration="20.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1350"></div>
      <div id="streets" data-composition-id="streets" data-composition-src="compositions/streets.html"
        data-start="32.6" data-duration="18.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1350"></div>
      <div id="brunch" data-composition-id="brunch" data-composition-src="compositions/brunch.html"

      <!-- voiceover: Wesley's cloned voice (VoiceStudio profile ca7acc09, VoxCPM2), de-plosived -->

      <audio id="vo-s2" class="clip" src="assets/vo/s2.wav" data-start="12.0" data-duration="18.98" data-track-index="3" data-volume="1.1"></audio>

</html>
