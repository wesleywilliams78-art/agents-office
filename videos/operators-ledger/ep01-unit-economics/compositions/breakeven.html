  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const warp = (P, t) => { if (t <= P[0][0]) return P[0][1] + t - P[0][0]; for (let i = 1; i < P.length; i++) if (t <= P[i][0]) { const [a0, b0] = P[i - 1], [a1, b1] = P[i]; return b0 + (b1 - b0) * (t - a0) / ((a1 - a0) || 1); } const L = P[P.length - 1]; return L[1] + t - L[0]; };
    const T = (w) => 0.3 + warp([[0.0, 0.0], [0.272, 0.52], [0.49, 0.66], [0.871, 0.94], [1.089, 1.28], [1.471, 1.64], [1.852, 2.36], [2.509, 2.92], [2.835, 3.24], [3.162, 3.72], [3.435, 4.04], [3.816, 4.96], [4.501, 5.56], [4.719, 5.76], [5.046, 6.1], [5.373, 6.54], [5.863, 6.732], [6.081, 6.924], [6.19, 7.116], [6.602, 7.308], [7.093, 7.5], [7.202, 8.16], [7.474, 8.36], [7.979, 8.82], [8.143, 9.06], [8.469, 9.3], [8.796, 10.18], [8.905, 10.78], [9.698, 11.06], [9.97, 11.3], [10.406, 11.7], [10.678, 11.88], [10.951, 12.14], [11.06, 12.3], [11.441, 12.48], [12.125, 13.0], [12.289, 13.58], [12.506, 13.72], [12.779, 13.94], [13.16, 14.56]], w); // voiceover starts 0.3 s in; old word time -> new
    const X = (s) => 160 + (s - 10000) * 0.06;
    const Y = (v) => 900 - (v - 6000) * 0.04;
    const cost = (s) => 7800 + (5500 / 13000) * s;
    const gbp = (v) => (v < -0.5 ? "−£" : "+£") + Math.round(Math.abs(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    const gauge = { s: 20000 };
    const drawGauge = () => {
      const s = gauge.s, ys = Y(s), yc = Y(cost(s)), x = X(s), p = s - cost(s);
      const g = document.querySelector("#e-gauge");
      g.setAttribute("x1", x); g.setAttribute("x2", x);
      g.setAttribute("y1", ys); g.setAttribute("y2", yc);
      g.setAttribute("stroke", p < 0 ? "#ec3013" : "#201e1d");
      document.querySelector("#e-mark").setAttribute("x", x - 8);
      const lab = document.querySelector("#e-gap");
      lab.textContent = gbp(p);
      lab.style.color = p < 0 ? "#ec3013" : "#201e1d";
      lab.style.transform = `translate(${x + 16}px, ${Math.max(ys, yc) + 14}px)`;
    };

    tl.fromTo(["#e-k1", "#e-k2"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 0.1);
    tl.fromTo("#e-xaxis", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.3);
    tl.fromTo("#e-yaxis", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 0.3);
    tl.fromTo(["#e-ticks", ".e-tick", "#e-axis-title"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.8);

    // "Rent and labour are mostly fixed"
    tl.fromTo("#e-r-fixed", { attr: { width: 0 } }, { attr: { width: 740 }, duration: 0.8, ease: "power3.inOut" }, T(1.2));
    tl.fromTo("#e-l-fixed", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(1.8));
    // "When sales fall, they don't"
    tl.fromTo("#e-r-sales", { attr: { width: 0 } }, { attr: { width: 740 }, duration: 0.8, ease: "power3.inOut" }, T(1.9));
    tl.fromTo("#e-l-sales", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(2.5));
    tl.fromTo("#e-r-cost", { attr: { width: 0 } }, { attr: { width: 740 }, duration: 0.8, ease: "power3.inOut" }, T(3.0));
    tl.fromTo("#e-l-cost", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(3.6));

    // "Site ten needs about thirteen and a half thousand a week just to break even"
    tl.fromTo(["#e-gauge", "#e-mark", "#e-gap"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T(3.8));
    tl.fromTo(gauge, { s: 20000 }, { s: 13000, duration: T(7.3) - T(4.1), ease: "power2.inOut", onUpdate: drawGauge, onStart: drawGauge }, T(4.1));
    tl.fromTo("#e-loss", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(6.7));
    tl.fromTo("#e-bel", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(8.1));
    tl.fromTo("#e-be", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, T(8.2));
    tl.set({}, {}, 17.4);

    window.__timelines["breakeven"] = tl;
  </script>
