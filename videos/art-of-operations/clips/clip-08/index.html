      const words = (sel, t, st, dur, ease) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: st }, t);
        return tl.fromTo(sel, { yPercent: 160 }, { yPercent: 0, duration: dur, ease: ease || pop, stagger: st }, t);
      };

      // a nearly still camera: this reel is about stillness
      tl.fromTo("#stage", { scale: 1 }, { scale: 1.03, duration: 15, ease: "none" }, 0);
      tl.to("#cover", { opacity: 0, duration: 1.6, ease: "power2.out" }, 0);
      tl.to("#cover", { opacity: 1, duration: 1.2, ease: "power2.in" }, 13.8);

      // English: slow, calm reveals
      words("#t1 .line:nth-child(1) .w", 1.5, 0.14, 1.4);
      words("#t1 .line:nth-child(2) .w", 2.2, 0.14, 1.4);
      words("#t1 .line:nth-child(3) .w", 3.2, 0.14, 1.4);
      words("#t1 .line:nth-child(4) .w", 4.0, 0.14, 1.4);
      words("#t1 .line:nth-child(5) .w", 4.8, 0.16, 1.4);
      tl.to("#t1 .w", { yPercent: -160, duration: 0.8, ease: "power2.in", stagger: 0.02 }, 7.0);
      tl.set("#t1", { opacity: 0 }, 8.0);

      // Chinese
      words("#t2 .line:nth-child(1) .w", 8.5, 0.16, 1.5);
      words("#t2 .line:nth-child(2) .w", 9.3, 0.10, 1.5);
      words("#t2 .line:nth-child(3) .w", 10.4, 0.12, 1.5);

      // end card
      tl.fromTo("#seal", { scale: 3, rotation: -12, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, opacity: 1, duration: 1.0, ease: "back.out(2.2)" }, 12.6);
      tl.fromTo("#k3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: pop }, 12.9);
      tl.fromTo("#rule3", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: pop }, 13.1);
      tl.fromTo("#k4", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: pop }, 13.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
